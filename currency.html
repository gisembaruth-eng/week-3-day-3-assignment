<!DOCTYPE html>
<html>

<head>
    <title>Currency Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <h1>Currency Converter</h1>

        <input type="number" id="amount" placeholder="Enter Amount">

        <select id="from">
            <option>KES</option>
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>TZS</option>
            <option>UGX</option>
        </select>

        <select id="to">
            <option>USD</option>
            <option>KES</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>TZS</option>
            <option>UGX</option>
        </select>

        <button id="convertBtn">Convert</button>
        <button id="swapBtn">Swap</button>

        <p id="loading" class="loading"></p>
        <p id="result" class="result"></p>
    </div>

    <script src="currency.js"></script>
</body>

</html>
